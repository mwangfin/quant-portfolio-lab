[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-portfolio-lab"
version = "0.1.0"
description = "ETF portfolio analytics, constrained optimization and walk-forward backtesting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "scipy>=1.11,<2",
  "yfinance>=0.2.54,<2",
  "plotly>=5.18,<7",
  "streamlit>=1.40,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
